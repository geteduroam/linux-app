name: "Test & check build"

on: [push, pull_request]

jobs:
  fmt-go:
    name: Check format Go
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/setup-go@v7
        with:
          go-version: ^1.27
      - uses: actions/checkout@v7
      - name: Install Gofumpt
        run: go install mvdan.cc/gofumpt@latest
      - name: Check fmt using Gofumpt
        run: |
             files=$(~/go/bin/gofumpt -l -d .);
             if [[ -n "$files" ]]; then
                 printf '%s\nGofumpt would make changes, install Gofumpt and run "make lint"' "$files";
                 exit 1;
             fi
        shell: bash

  lint-go:
    name: Lint Go
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/setup-go@v7
        with:
          go-version: ^1.27
      - uses: actions/checkout@v7
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
# See https://github.com/golangci/golangci-lint-action/issues/485 for why we do --out-....
        with:
          version: latest
          args: "-E staticcheck,revive,gocritic --timeout 5m"

  build-cli:
    name: Build CLI
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ^1.27
      - run: make build-cli

  build-gui:
    name: Build GUI
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ^1.27
      - run: sudo apt-get update -y && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libgirepository1.0-dev
      - run: make build-gui

  test-go:
    name: Test Go
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ^1.27
      - run: make test
